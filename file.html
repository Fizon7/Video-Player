<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omar's YouTube Embed - YouTube Embed Generator</title>
    <style>
        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --accent: #ff4d6d;
            --muted: #9aa4b2;
            --glass: rgba(255,255,255,0.03);
        }
        
        * {
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            margin: 0;
            background: linear-gradient(180deg, #061022 0%, #0b1220 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: #e6eef6;
        }
        
        body {
            max-width: 900px;
            margin: 40px auto;
            padding: 28px;
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            box-shadow: 0 10px 30px rgba(2,6,23,0.6);
        }
        
        h1 {
            color: #e6eef6;
            margin: 0 0 0.5rem 0;
            font-size: 24px;
            letter-spacing: 0.2px;
        }
        
        p.subtitle {
            color: var(--muted);
            margin-top: 0;
            font-size: 14px;
        }
        
        p.subtitle a {
            color: var(--accent);
            text-decoration: none;
        }
        
        p.subtitle a:hover {
            text-decoration: underline;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 14px;
            color: var(--muted);
        }
        
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 8px;
            font-size: 1rem;
            background: transparent;
            color: #e6eef6;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        button {
            background: linear-gradient(90deg, var(--accent), #ff7b8f);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
            font-weight: 600;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .output-section {
            margin-top: 2rem;
            display: none;
        }
        
        .output-section.visible {
            display: block;
        }
        
        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.875rem;
            resize: vertical;
            background: transparent;
            color: #e6eef6;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .copy-btn {
            margin-top: 0.5rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
            border: 1px solid rgba(255,255,255,0.03);
            color: #eaf3ff;
        }
        
        .copy-btn:hover {
            opacity: 0.85;
        }
        
        .preview-section {
            margin-top: 2rem;
        }
        
        .preview-section h3 {
            margin-bottom: 1rem;
            color: #e6eef6;
            font-size: 16px;
        }
        
        #preview {
            background: var(--card);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
        }
        
        .error {
            color: #ff6b7b;
            margin-top: 0.5rem;
            font-size: 14px;
        }
        
        details.optional-settings {
            margin-top: 1.5rem;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 8px;
            background: var(--card);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
        }
        
        details.optional-settings summary {
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-weight: 500;
            color: var(--muted);
            user-select: none;
            font-size: 14px;
        }
        
        details.optional-settings summary:hover {
            background: rgba(255,255,255,0.01);
        }
        
        details.optional-settings[open] summary {
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        
        details.optional-settings .details-content {
            padding: 1rem;
        }
        
        .icon-options {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        
        .icon-option {
            width: 80px;
            height: 56px;
            border: 2px solid rgba(255,255,255,0.04);
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        
        .icon-option:hover {
            border-color: rgba(255,255,255,0.1);
        }
        
        .icon-option.selected {
            border-color: var(--accent);
            border-width: 3px;
        }
        
        .icon-option svg {
            width: 40px;
            height: auto;
        }
        
        input[type="color"] {
            width: 56px;
            height: 56px;
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }
        
        small {
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <h1>Omar's YouTube Embed</h1>
    <p class="subtitle">Privacy-first YouTube embed generator with lazy-loading thumbnail and custom play button. <a 

    <div class="form-group">
        <label for="url">YouTube Video URL</label>
        <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." />
        <p class="error" id="error" style="display: none;"></p>
    </div>

    <details class="optional-settings">
        <summary>Optional Settings</summary>
        <div class="details-content">
            <div class="form-group">
                <label for="custom-cover">Custom Cover Image URL</label>
                <input type="text" id="custom-cover" placeholder="Leave empty to use YouTube thumbnail" />
                <small>Override the default YouTube video thumbnail</small>
            </div>

            <div class="form-group">
                <label>Play Icon Style</label>
                <div class="icon-options">
                    <div class="icon-option selected" data-style="youtube" onclick="selectIcon(this)">
                        <svg viewBox="0 0 68 48">
                            <path class="icon-bg" d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#ff4d6d"/>
                            <path d="M45 24L27 14v20" fill="#fff"/>
                        </svg>
                    </div>
                    <div class="icon-option" data-style="triangle" onclick="selectIcon(this)">
                        <svg viewBox="0 0 68 68">
                            <path class="icon-fill" d="M20 12 L56 34 L20 56 Z" fill="#ff4d6d"/>
                        </svg>
                    </div>
                    <input type="color" id="icon-color" value="#ff4d6d" oninput="updateIconColors(this.value)" />
                </div>
            </div>
        </div>
    </details>

    <button onclick="generateEmbed()" style="margin-top: 1rem;">Generate Embed Code</button>

    <div class="output-section" id="output-section">
        <h3>Embed Code</h3>
        <textarea id="embed-code" readonly></textarea>
        <button class="copy-btn" onclick="copyCode()">Copy to Clipboard</button>

        <div class="preview-section">
            <h3>Preview</h3>
            <div id="preview"></div>
        </div>
    </div>

    <script>
        function extractVideoId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
                /^([a-zA-Z0-9_-]{11})$/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        function getPlayIcon(style, color) {
            if (style === 'triangle') {
                return `<svg style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:68px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));" viewBox="0 0 68 68">
        <path d="M20 12 L56 34 L20 56 Z" fill="${color}"/>
    </svg>`;
            }
            return `<svg style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:48px;" viewBox="0 0 68 48">
        <path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="${color}"/>
        <path d="M45 24L27 14v20" fill="#fff"/>
    </svg>`;
        }

        function generateEmbed() {
            const urlInput = document.getElementById('url').value.trim();
            const customCover = document.getElementById('custom-cover').value.trim();
            const iconStyle = document.querySelector('.icon-option.selected').dataset.style;
            const iconColor = document.getElementById('icon-color').value;
            const errorEl = document.getElementById('error');
            const outputSection = document.getElementById('output-section');
            
            errorEl.style.display = 'none';
            
            const videoId = extractVideoId(urlInput);
            
            if (!videoId) {
                errorEl.textContent = 'Invalid YouTube URL. Please enter a valid YouTube video URL.';
                errorEl.style.display = 'block';
                outputSection.classList.remove('visible');
                return;
            }

            const coverImage = customCover || `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
            const fallbackAttr = customCover ? '' : ` onerror="this.src='https://i.ytimg.com/vi/${videoId}/hqdefault.jpg'"`;
            const playIcon = getPlayIcon(iconStyle, iconColor);

            const embedCode = `<a class="yt-privacy-embed" href="https://www.youtube.com/watch?v=${videoId}" style="display:block;position:relative;width:100%;aspect-ratio:16/9;background:#000;" onclick="event.preventDefault();this.outerHTML='<iframe width=\\'100%\\' height=\\'100%\\' src=\\'https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1\\' title=\\'YouTube video player\\' frameborder=\\'0\\' allow=\\'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\\' referrerpolicy=\\'strict-origin-when-cross-origin\\' allowfullscreen style=\\'aspect-ratio:16/9;\\'></iframe>'">
    <img src="${coverImage}" alt="Video thumbnail" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;"${fallbackAttr}>
    ${playIcon}
</a>`;

            document.getElementById('embed-code').value = embedCode;
            document.getElementById('preview').innerHTML = embedCode;
            outputSection.classList.add('visible');
        }

        function copyCode() {
            const textarea = document.getElementById('embed-code');
            textarea.select();
            document.execCommand('copy');
            
            const btn = document.querySelector('.copy-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }

        function selectIcon(el) {
            const color = document.getElementById('icon-color').value;
            document.querySelectorAll('.icon-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            el.classList.add('selected');
        }

        function updateIconColors(color) {
            document.querySelectorAll('.icon-option .icon-bg, .icon-option .icon-fill').forEach(path => {
                path.setAttribute('fill', color);
            });
            document.querySelectorAll('.icon-option').forEach(opt => {
                opt.style.borderColor = opt.classList.contains('selected') ? color : '';
            });
        }

        document.getElementById('url').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateEmbed();
        });
    </script>
</body>
</html>
